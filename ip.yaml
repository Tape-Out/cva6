  - third_party/cva6/common/local/util/tc_sram_wrapper.sv
  - third_party/cva6/common/local/util/tc_sram_wrapper_cache_techno.sv
  - third_party/cva6/vendor/pulp-platform/tech_cells_generic/src/rtl/tc_sram.sv
  - third_party/cva6/common/local/util/sram.sv
  - third_party/cva6/common/local/util/sram_cache.sv
  - third_party/cva6/core/cva6_mmu/cva6_mmu.sv
  - third_party/cva6/core/cva6_mmu/cva6_ptw.sv
  - third_party/cva6/core/cva6_mmu/cva6_tlb.sv
  - third_party/cva6/core/cva6_mmu/cva6_shared_tlb.sv
  includes:
  - third_party/cva6/core/include
  - third_party/cva6/vendor/pulp-platform/common_cells/include
  - third_party/cva6/vendor/pulp-platform/common_cells/src
  - third_party/cva6/vendor/pulp-platform/axi/include
  - third_party/cva6/common/local/util
  - third_party/cva6/core/cache_subsystem/hpdcache/rtl/src/utils/ecc
  - third_party/cva6/core/cache_subsystem/hpdcache/rtl/include
  params: {}
  defines:
  - VERILATOR
  - SYNTHESIS
  clock:
    port: clk_i
  reset:
    port: rst_ni
    active: low
    sync: true
  ports:
  - endpoint: mem
    kind: transaction
    role: manager
    profile: cva6-noc
    map:
      req: noc_req_o
      resp: noc_resp_i
  - endpoint: cvxif
    kind: transaction
    role: manager
    profile: cvxif
    map:
      req: cvxif_req_o
      resp: cvxif_resp_i
  - endpoint: irq
    kind: event
    role: sink
    map:
      irq: irq_i
      ipi: ipi_i
      timer: time_irq_i
      debug: debug_req_i
  - endpoint: cfg
    kind: physical
    type: Cva6Boot
    map:
      bootAddr: boot_addr_i
      hartId: hart_id_i
  - endpoint: rvfi
    kind: physical
    type: Cva6Rvfi
    map:
      probes: rvfi_probes_o
  limits:
  - 对外是一条打包成结构体的 AXI（noc_req_o／noc_resp_i），不是逐根线的 AXI 端口
  - CVA6Cfg 是 17270 位的结构体参数，改配置靠换 core/include/<变体>_config_pkg.sv，本仓把这一步做成 cfg 旋钮
  - AccCfg 是 acc_cfg_t 结构体，留在默认值 '0 上
  - cv64a6_imafdcv_sv39（向量）这一档上游自身编不过，未纳入取值域
  - core/acc_dispatcher.sv 不在清单里：支持的 12 档都不开加速器接口，实测拿掉之后十二档展开一字不差。要支持向量档时连它一起按 when 加回来
  - 烘焙成纯 Verilog 走不通：sv2v 0.0.13 在这份设计上会指数膨胀（四分钟 6 GB、中间件 500 MB），同一条链路烘 Ibex 与 CV32E40P 都能逐字节复现，所以是 CVA6 独有、尚未定位。展开与回执不受影响
test:
  noarea:
  - cfg
targets:
  foreign:
    driver: foreign
