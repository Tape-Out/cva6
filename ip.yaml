guards:
- when:
    CVA6ConfigXlen: 32
  narrow:
    CVA6ConfigRVD:
    - 0
  why: RV32 开 D 扩展时上游把 FLen 推成 64，issue_read_operands.sv:676 的 {XLEN - FLen{1'b0}} 复制份数为负，展开报 value must be positive
- when:
    CVA6ConfigRVF: 0
  narrow:
    CVA6ConfigRVD:
    - 0
  why: D 扩展依赖 F：上游的 FLen 推导链里 RVD 直接短路掉 RVF 那一档，只开 D 得到的是一个 RISC-V 里不存在的 ISA
- when:
    CVA6ConfigRVF: 0
    CVA6ConfigRVD: 0
    CVA6ConfigF16En: 0
    CVA6ConfigF16AltEn: 0
  narrow:
    CVA6ConfigF8En:
    - 0
  why: FP8 单独开时 FLen=8，而 cvfpu 的除法开方单元只支持 64/32/16 位，fpnew_divsqrt_th_64_multi.sv:193 当场 $fatal。要开 FP8 得同时留一种更宽的格式
- when:
    CVA6ConfigRVF: 0
    CVA6ConfigRVD: 0
    CVA6ConfigF16En: 0
    CVA6ConfigF16AltEn: 0
    CVA6ConfigF8En: 0
  narrow:
    CVA6ConfigFVecEn:
    - 0
  why: 一种浮点格式都没开时向量浮点没有可向量化的格式，上游的 RVFVec/XF16Vec/XF8Vec 全部恒零
- when:
    CVA6ConfigXlen: 64
  narrow:
    CVA6ConfigAxiDataWidth:
    - 64
    - 128
  why: wt_axi_adapter.sv:145 把一拍 AXI 数据拼成 AxiDataWidth/XLEN 份，AXI 数据通路窄于 XLEN 时份数为零，展开报「复制常数只能为零」
- when:
    CVA6ConfigXlen: 32
  narrow:
    VLEN:
    - 32
  why: branch_unit.sv:124 把异常地址拼成 {XLEN - VLEN{...}}，虚地址宽于 XLEN 时复制份数为负
- when:
    CVA6ConfigDcacheType: config_pkg::HPDCACHE_WT
  narrow:
    CVA6ConfigMemTidWidth:
    - 4
    CVA6ConfigWtDcacheWbufDepth:
    - 2
    - 4
    - 7
    - 8
  why: hpdcache 把写缓冲的每一项、每一次未命中都编一个 mem ID：2^MemTidWidth-1 要装得下写缓冲深度与 NrLoadBufEntries，不够时 hpdcache.sv 的 $fatal 在展开期就打出来
- when:
    CVA6ConfigDcacheType: config_pkg::HPDCACHE_WB
  narrow:
    CVA6ConfigMemTidWidth:
    - 4
    CVA6ConfigWtDcacheWbufDepth:
    - 2
    - 4
    - 7
  why: 写回档还要留半个 ID 空间给回写与 flush，所以比写通档再紧一档：2^(MemTidWidth-1)-1 要装得下 flushEntries
- when:
    NOCType: config_pkg::NOC_TYPE_L15_BIG_ENDIAN
  narrow:
    CVA6ConfigDcacheType:
    - config_pkg::WT
    - config_pkg::WB
  why: 走 OpenPiton 的 L15 接口时，树上只有 dummy_l15_pkg——它自己写着「真包在 OpenPiton 里」。标准缓存的适配器用不到那些字段，hpdcache 的适配器要 l15_val 等等，展开报 no member named
