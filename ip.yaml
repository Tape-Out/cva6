  - 对外是一条打包成结构体的 AXI（noc_req_o／noc_resp_i），不是逐根线的 AXI 端口
  - AccCfg 是 acc_cfg_t 结构体，留在默认值 '0 上
  - cv64a6_imafdcv_sv39（向量）这一档上游自身编不过，未纳入取值域
  - core/acc_dispatcher.sv 不在清单里：支持的 12 档都不开加速器接口，实测拿掉之后十二档展开一字不差。要支持向量档时连它一起按 when 加回来
  - 烘焙成纯 Verilog 走不通：sv2v 0.0.13 在这份设计上会指数膨胀（四分钟 6 GB、中间件 500 MB），同一条链路烘 Ibex 与 CV32E40P 都能逐字节复现，所以是 CVA6 独有、尚未定位。展开与回执不受影响
  - 生成器以 cv64a6_imafdc_sv39 为模板，只换暴露出去的字段；没暴露的保持上游值，上游加了字段也不会漏
  - cfg=xirang 由息壤的 generate 按旋钮改写上游的配置包生成；xlen 决定照哪一份改（64 位用 cv64a6_imafdc_sv39，32 位用 cv32a6_imac_sv32），因为字长牵动整份配置，不是一个能单独翻的字段
